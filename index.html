<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Weather App</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <h1>My Weather App</h1>

  <!-- search -->
  <div class="search-box">
    <input type="text" id="cityInput" placeholder="Enter city name...">
    <button id="searchBtn">Search</button>
    <button id="locationBtn">My location</button>
  </div>

  <!-- quick city buttons -->
  <div class="quick-cities">
    <button class="city-btn">Lahore</button>
    <button class="city-btn">London</button>
    <button class="city-btn">New York</button>
    <button class="city-btn">Tokyo</button>
    <button class="city-btn">Dubai</button>
    <button class="city-btn">Sydney</button>
  </div>

  <!-- units -->
  <div class="units">
    <button id="celsiusBtn" class="active">°C</button>
    <button id="fahrenheitBtn">°F</button>
  </div>

  <!-- pressure units -->
  <div class="units">
    <button id="pressureHpaBtn" class="active">hPa</button>
    <button id="pressureInHgBtn">inHg</button>
  </div>

  <p id="message">Loading weather...</p>

  <!-- main card -->
  <div id="weatherCard" class="card hidden">
    <h2 id="cityName"></h2>
    <p id="description"></p>
    <img id="icon" src="" alt="weather icon">
    <p id="temp" class="big-temp"></p>
    <p id="feelsLike"></p>

    <div class="details">
      <div class="detail-box"><p>Humidity</p><b id="humidity"></b></div>
      <div class="detail-box"><p>Wind</p><b id="wind"></b></div>
      <div class="detail-box"><p>Visibility</p><b id="visibility"></b></div>
      <div class="detail-box"><p>Pressure</p><b id="pressure"></b></div>
      <div class="detail-box"><p>Sunrise</p><b id="sunrise"></b></div>
      <div class="detail-box"><p>Sunset</p><b id="sunset"></b></div>
    </div>
  </div>

  <!-- hourly -->
  <div id="hourlySection" class="hidden">
    <h3>Hourly Forecast</h3>
    <div id="hourly" class="row"></div>
  </div>

  <!-- 5 day -->
  <div id="dailySection" class="hidden">
    <h3>Daily Forecast</h3>
    <div id="daily" class="row"></div>
  </div>

  <p class="footer">Data from WeatherAPI.com</p>

  <script src="js/script.js"></script>
</body>
</html>
